# Linear theme for eza
# Ported from the Linear theme palette
filekinds:
  normal:
    foreground: "#e6e9ef"
  directory:
    foreground: "#c2a1ff"
    is_bold: true
  symlink:
    foreground: "#f5c56a"
    is_italic: true
  pipe:
    foreground: "#636b7b"
  block_device:
    foreground: "#f5c56a"
  char_device:
    foreground: "#f5c56a"
  socket:
    foreground: "#f5c56a"
  special:
    foreground: "#636b7b"
  executable:
    foreground: "#c2a1ff"
  mount_point:
    foreground: "#c2a1ff"
    is_bold: true

perms:
  user_read:
    foreground: "#f5c56a"
  user_write:
    foreground: "#ff7e78"
  user_execute_file:
    foreground: "#c2a1ff"
  user_execute_other:
    foreground: "#c2a1ff"
  group_read:
    foreground: "#f5c56a"
  group_write:
    foreground: "#ff7e78"
  group_execute:
    foreground: "#c2a1ff"
  other_read:
    foreground: "#f5c56a"
  other_write:
    foreground: "#ff7e78"
  other_execute:
    foreground: "#c2a1ff"
  special_user_file:
    foreground: "#f5c56a"
  special_other:
    foreground: "#f5c56a"
  attribute:
    foreground: "#636b7b"

size:
  number_byte:
    foreground: "#c2a1ff"
  number_kilo:
    foreground: "#c2a1ff"
  number_mega:
    foreground: "#f5c56a"
  number_giga:
    foreground: "#ff7e78"
  number_huge:
    foreground: "#ff7e78"
    is_bold: true
  unit_byte:
    foreground: "#636b7b"
  unit_kilo:
    foreground: "#636b7b"
  unit_mega:
    foreground: "#636b7b"
  unit_giga:
    foreground: "#636b7b"
  unit_huge:
    foreground: "#636b7b"

users:
  user_you:
    foreground: "#f5c56a"
  user_other:
    foreground: "#636b7b"
  group_yours:
    foreground: "#f5c56a"
  group_other:
    foreground: "#636b7b"

links:
  normal:
    foreground: "#636b7b"
  multi_link_file:
    foreground: "#f5c56a"

git:
  new:
    foreground: "#c2a1ff"
  modified:
    foreground: "#f5c56a"
  deleted:
    foreground: "#ff7e78"
  renamed:
    foreground: "#c2a1ff"
  ignored:
    foreground: "#636b7b"
  conflicted:
    foreground: "#ff7e78"
    is_bold: true

git_repo:
  branch_main:
    foreground: "#c2a1ff"
    is_bold: true
  branch_other:
    foreground: "#f5c56a"
  git_clean:
    foreground: "#c2a1ff"
  git_dirty:
    foreground: "#ff7e78"

security_context:
  colon:
    foreground: "#636b7b"
  user:
    foreground: "#f5c56a"
  role:
    foreground: "#c2a1ff"
  typ:
    foreground: "#b5bccb"
  range:
    foreground: "#636b7b"

filetype:
  image:
    foreground: "#f5c56a"
  video:
    foreground: "#f5c56a"
  music:
    foreground: "#f5c56a"
  crypto:
    foreground: "#ff7e78"
  document:
    foreground: "#e6e9ef"
  compressed:
    foreground: "#ff7e78"
  temp:
    foreground: "#636b7b"
  compiled:
    foreground: "#b5bccb"

punctuation:
  foreground: "#636b7b"

date:
  foreground: "#b5bccb"

inode:
  foreground: "#636b7b"

blocks:
  foreground: "#636b7b"

header:
  foreground: "#636b7b"
  is_underline: true

symlink_path:
  foreground: "#636b7b"

control_char:
  foreground: "#ff7e78"

broken_symlink:
  foreground: "#ff7e78"

broken_path_overlay:
  foreground: "#ff7e78"
  is_underline: true
