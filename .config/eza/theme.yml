# Vesper theme for eza
filekinds:
  normal:
    foreground: "#ffffff"
  directory:
    foreground: "#99ffe4"
    is_bold: true
  symlink:
    foreground: "#ffc799"
    is_italic: true
  pipe:
    foreground: "#505050"
  block_device:
    foreground: "#ffc799"
  char_device:
    foreground: "#ffc799"
  socket:
    foreground: "#ffc799"
  special:
    foreground: "#505050"
  executable:
    foreground: "#99ffe4"
  mount_point:
    foreground: "#99ffe4"
    is_bold: true

perms:
  user_read:
    foreground: "#ffc799"
  user_write:
    foreground: "#ff8080"
  user_execute_file:
    foreground: "#99ffe4"
  user_execute_other:
    foreground: "#99ffe4"
  group_read:
    foreground: "#ffc799"
  group_write:
    foreground: "#ff8080"
  group_execute:
    foreground: "#99ffe4"
  other_read:
    foreground: "#ffc799"
  other_write:
    foreground: "#ff8080"
  other_execute:
    foreground: "#99ffe4"
  special_user_file:
    foreground: "#ffc799"
  special_other:
    foreground: "#ffc799"
  attribute:
    foreground: "#505050"

size:
  number_byte:
    foreground: "#99ffe4"
  number_kilo:
    foreground: "#99ffe4"
  number_mega:
    foreground: "#ffc799"
  number_giga:
    foreground: "#ff8080"
  number_huge:
    foreground: "#ff8080"
    is_bold: true
  unit_byte:
    foreground: "#505050"
  unit_kilo:
    foreground: "#505050"
  unit_mega:
    foreground: "#505050"
  unit_giga:
    foreground: "#505050"
  unit_huge:
    foreground: "#505050"

users:
  user_you:
    foreground: "#ffc799"
  user_other:
    foreground: "#505050"
  group_yours:
    foreground: "#ffc799"
  group_other:
    foreground: "#505050"

links:
  normal:
    foreground: "#505050"
  multi_link_file:
    foreground: "#ffc799"

git:
  new:
    foreground: "#99ffe4"
  modified:
    foreground: "#ffc799"
  deleted:
    foreground: "#ff8080"
  renamed:
    foreground: "#99ffe4"
  ignored:
    foreground: "#505050"
  conflicted:
    foreground: "#ff8080"
    is_bold: true

git_repo:
  branch_main:
    foreground: "#99ffe4"
    is_bold: true
  branch_other:
    foreground: "#ffc799"
  git_clean:
    foreground: "#99ffe4"
  git_dirty:
    foreground: "#ff8080"

security_context:
  colon:
    foreground: "#505050"
  user:
    foreground: "#ffc799"
  role:
    foreground: "#99ffe4"
  typ:
    foreground: "#a0a0a0"
  range:
    foreground: "#505050"

filetype:
  image:
    foreground: "#ffc799"
  video:
    foreground: "#ffc799"
  music:
    foreground: "#ffc799"
  crypto:
    foreground: "#ff8080"
  document:
    foreground: "#ffffff"
  compressed:
    foreground: "#ff8080"
  temp:
    foreground: "#505050"
  compiled:
    foreground: "#a0a0a0"

punctuation:
  foreground: "#505050"

date:
  foreground: "#a0a0a0"

inode:
  foreground: "#505050"

blocks:
  foreground: "#505050"

header:
  foreground: "#505050"
  is_underline: true

symlink_path:
  foreground: "#505050"

control_char:
  foreground: "#ff8080"

broken_symlink:
  foreground: "#ff8080"

broken_path_overlay:
  foreground: "#ff8080"
  is_underline: true
